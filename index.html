<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Özel Görüntülü Sohbet & Sinema Odası</title>
    <!-- PeerJS Kütüphanesi -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background: #121212; 
            color: #e0e0e0; 
            margin: 0; 
            padding: 15px; 
            padding-bottom: 40px;
        }
        
        h2 { margin-top: 10px; font-size: 1.8rem; color: #ffffff; }

        .controls { 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            gap: 12px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            max-width: 450px;
            margin: 0 auto 20px auto;
        }

        .buttons-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            width: 100%;
            justify-content: center;
        }

        input, button { 
            padding: 12px 15px; 
            font-size: 15px; 
            border-radius: 8px; 
            border: none; 
            transition: all 0.3s ease;
        }

        input[type="text"] { 
            width: 100%; 
            background: #2a2a2a; 
            color: white; 
            border: 1px solid #444; 
        }
        
        input[type="text"]:focus { outline: none; border-color: #007bff; }
        
        button { 
            background: #007bff; 
            color: white; 
            cursor: pointer; 
            font-weight: 600;
            flex-grow: 1;
        }
        
        button:hover { background: #0056b3; transform: translateY(-2px); }
        button.action-btn { background: #ff4757; }
        button.action-btn:hover { background: #ff6b81; }
        
        #my-id { font-weight: bold; color: #2ed573; font-size: 1.3em; word-break: break-all; letter-spacing: 1px;}
        
        /* Video Alanı */
        .video-container { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 20px; 
        }
        
        .video-wrapper {
            width: 100%;
            max-width: 450px;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        video { 
            width: 100%; 
            aspect-ratio: 16/9; 
            background: #000; 
            border-radius: 8px; 
            object-fit: cover; 
        }

        .fs-btn {
            margin-top: 10px;
            background: #2ed573;
            width: 100%;
        }
        .fs-btn:hover { background: #7bed9f; }

        /* Sohbet (Chat) Alanı */
        .chat-container {
            width: 100%;
            max-width: 920px;
            margin: 20px auto 0 auto;
            background: #1e1e1e;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .chat-header {
            background: #2a2a2a;
            padding: 10px;
            font-weight: bold;
            font-size: 1.1rem;
            border-bottom: 1px solid #444;
        }

        .chat-messages {
            height: 200px;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: left;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 15px;
            font-size: 14px;
            line-height: 1.4;
        }

        .message.sent {
            align-self: flex-end;
            background: #007bff;
            color: white;
            border-bottom-right-radius: 2px;
        }

        .message.received {
            align-self: flex-start;
            background: #333;
            color: white;
            border-bottom-left-radius: 2px;
        }

        .chat-input-area {
            display: flex;
            padding: 10px;
            background: #2a2a2a;
            gap: 10px;
        }

        .chat-input-area input {
            flex-grow: 1;
            margin: 0;
        }
        
        .chat-input-area button {
            flex-grow: 0;
            width: auto;
            background: #2ed573;
        }
        .chat-input-area button:hover { background: #26b360; }
        
        /* Görüntü Birleştirme için Tuval (Gizli) */
        canvas#mixing-canvas {
            display: none;
        }
    </style>
</head>
<body>

    <h2>🍿 Özel Sinema Odası</h2>
    <div class="controls">
        <p style="margin-top: 0;">Senin ID'n:<br> <span id="my-id">Bağlanıyor...</span></p>
        <input type="text" id="partner-id" placeholder="Karşı tarafın ID'sini gir">
        <div class="buttons-row">
            <button onclick="makeCall()">Bağlan (Ara)</button>
            <button class="action-btn" id="share-btn" onclick="shareScreen()">Ekran & Ses Paylaş</button>
        </div>
    </div>

    <div class="video-container">
        <div class="video-wrapper">
            <h3 style="margin-top: 0;">Sen</h3>
            <!-- Senin videon (Ekranda görünür) -->
            <video id="my-video" autoplay muted playsinline></video>
            
            <!-- Görüntü birleştirme için kullanılacak gizli video etiketleri -->
            <video id="temp-camera-video" autoplay muted playsinline style="display:none;"></video>
            <video id="temp-screen-video" autoplay muted playsinline style="display:none;"></video>
            
            <!-- Birleştirme tuvali (Gizli kalacak) -->
            <canvas id="mixing-canvas" width="1280" height="720"></canvas>
        </div>
        <div class="video-wrapper">
            <h3 style="margin-top: 0;">Kız Arkadaşın</h3>
            <video id="remote-video" autoplay playsinline></video>
            <button class="fs-btn" onclick="openFullscreen()">🎬 Tam Ekranda İzle</button>
        </div>
    </div>

    <!-- Sohbet (Chat) Arayüzü -->
    <div class="chat-container">
        <div class="chat-header">💬 Mesajlar</div>
        <div class="chat-messages" id="chat-messages">
            <div style="text-align: center; color: #777; font-size: 0.9em;">Bağlantı kurulduğunda buradan mesajlaşabilirsiniz.</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Mesajını yaz..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Gönder</button>
        </div>
    </div>

    <script>
        const peer = new Peer();
        let localCameraStream; // Kamerayı burada saklayacağız
        let currentCall;
        let dataConnection;
        let isSharingScreen = false;
        let animationFrameId; // Tuval çizimini durdurmak için

        // Kendi ID'ni ekrana yazdır
        peer.on('open', (id) => {
            document.getElementById('my-id').innerText = id;
        });

        // 1. Kamerayı ve Mikrofonu Başlat
        navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 }, audio: true })
            .then((stream) => {
                localCameraStream = stream;
                // Kendi pencerene kamerayı yansıt
                document.getElementById('my-video').srcObject = stream;
                // Birleştirme için gizli video etiketine kamerayı yansıt
                document.getElementById('temp-camera-video').srcObject = stream;
            })
            .catch(err => console.error("Kamera/Mikrofon izni alınamadı!", err));

        // 2. Karşıdan Gelen Aramayı Cevapla
        peer.on('call', (call) => {
            currentCall = call;
            // Kendi kamera akışını gönder (Daha ekran paylaşılmadı)
            call.answer(localCameraStream); 
            
            call.on('stream', (remoteStream) => {
                document.getElementById('remote-video').srcObject = remoteStream;
                playRemoteVideo();
            });
        });

        peer.on('connection', (conn) => {
            dataConnection = conn;
            setupChatListener();
        });

        // 3. Arama Yapma Fonksiyonu
        function makeCall() {
            const partnerId = document.getElementById('partner-id').value;
            if (!partnerId) return alert("Lütfen bir ID girin!");

            const call = peer.call(partnerId, localCameraStream);
            currentCall = call;

            call.on('stream', (remoteStream) => {
                document.getElementById('remote-video').srcObject = remoteStream;
                playRemoteVideo();
            });

            dataConnection = peer.connect(partnerId);
            setupChatListener();
        }

        // Mobil otomatik oynatma çözümü
        function playRemoteVideo() {
            setTimeout(() => {
                document.getElementById('remote-video').play().catch(err => {
                    console.log("Oynatma hatası:", err);
                });
            }, 500);
        }

        // 4. Sohbet (Chat) Fonksiyonları
        function setupChatListener() {
            dataConnection.on('open', () => {
                document.getElementById('chat-messages').innerHTML = '<div style="text-align: center; color: #2ed573; font-size: 0.9em;">Bağlantı başarılı! Mesajlaşabilirsiniz.</div>';
            });
            dataConnection.on('data', (data) => {
                appendMessage(data, 'received');
            });
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            if (!message) return;
            if (!dataConnection || !dataConnection.open) { alert("Önce bağlanmalısınız!"); return; }
            dataConnection.send(message);
            appendMessage(message, 'sent');
            input.value = '';
        }

        function appendMessage(text, type) {
            const chatBox = document.getElementById('chat-messages');
            const msgElement = document.createElement('div');
            msgElement.classList.add('message', type);
            msgElement.innerText = text;
            chatBox.appendChild(msgElement);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleKeyPress(event) { if (event.key === 'Enter') sendMessage(); }

        // 5. Gelişmiş Görüntü Birleştirme (Hem Ekran Hem Ben)
        function shareScreen() {
            if (isSharingScreen) return; // Zaten paylaşılıyorsa tekrar başlatma

            navigator.mediaDevices.getDisplayMedia({ video: { width: 1280, height: 720 }, audio: true })
                .then((screenStream) => {
                    isSharingScreen = true;
                    document.getElementById('share-btn').innerText = "Paylaşımı Durdur";
                    
                    // Ekran görüntüsünü gizli video etiketine yansıt
                    const tempScreenVideo = document.getElementById('temp-screen-video');
                    tempScreenVideo.srcObject = screenStream;
                    
                    // Tuval (Canvas) ve Çizim Ayarları
                    const canvas = document.getElementById('mixing-canvas');
                    const ctx = canvas.getContext('2d');
                    const tempCameraVideo = document.getElementById('temp-camera-video');

                    // Görüntüleri Tuval üzerinde birleştirme döngüsü
                    function drawOverlay() {
                        if (!isSharingScreen) return; // Paylaşım bittiyse çizimi durdur

                        // 1. Arka plana Ekran görüntüsünü çiz (Diziyi/Filmi)
                        ctx.drawImage(tempScreenVideo, 0, 0, canvas.width, canvas.height);
                        
                        // 2. Sağ alt köşeye kameranı (Kendi yüzünü) çiz
                        const camWidth = canvas.width * 0.2; // Ekranın %20'si kadar genişlik
                        const camHeight = canvas.height * 0.2;
                        const x = canvas.width - camWidth - 20; // 20px kenar boşluğu
                        const y = canvas.height - camHeight - 20;
                        
                        // Kameranın etrafına küçük bir kenarlık çiz (Netlik için)
                        ctx.lineWidth = 4;
                        ctx.strokeStyle = "#444";
                        ctx.strokeRect(x, y, camWidth, camHeight);
                        // Kamera görüntüsünü yapıştır
                        ctx.drawImage(tempCameraVideo, x, y, camWidth, camHeight);

                        // Bir sonraki ekran yenilemesinde tekrar çiz
                        animationFrameId = requestAnimationFrame(drawOverlay);
                    }

                    // Birleştirmeyi başlat
                    drawOverlay();

                    // Tuvalden bir akış (Stream) oluştur (Görüntü ve Ses)
                    const mixedStream = canvas.captureStream(30); // 30 FPS

                    // Tuval akışına Ekran Sesini (Eğer kullanıcı izin verdiyse) ekle
                    if (screenStream.getAudioTracks().length > 0) {
                        mixedStream.addTrack(screenStream.getAudioTracks()[0]);
                    }

                    // Senin pencerene bu birleşmiş görüntüyü yansıt (Sen de gör)
                    document.getElementById('my-video').srcObject = mixedStream;
                    
                    // Eğer aktif bir arama varsa, giden görüntüyü bu birleşmiş görüntüyle değiştir
                    if (currentCall) {
                        const videoTrack = mixedStream.getVideoTracks()[0];
                        const videoSender = currentCall.peerConnection.getSenders().find(s => s.track.kind === 'video');
                        if (videoSender && videoTrack) videoSender.replaceTrack(videoTrack);

                        const audioTrack = mixedStream.getAudioTracks()[0];
                        const audioSender = currentCall.peerConnection.getSenders().find(s => s.track.kind === 'audio');
                        if (audioSender && audioTrack) audioSender.replaceTrack(audioTrack);
                    }

                    // Ekran paylaşımı durdurulduğunda (Paylaşımı durdur butonuna basıldığında)
                    screenStream.getVideoTracks()[0].onended = stopScreenSharing;
                })
                .catch(err => {
                    console.error("Ekran paylaşılamadı!", err);
                    stopScreenSharing();
                });
        }

        // Ekran Paylaşımını Durdurma Fonksiyonu
        function stopScreenSharing() {
            isSharingScreen = false;
            document.getElementById('share-btn').innerText = "Ekran & Ses Paylaş";
            cancelAnimationFrame(animationFrameId); // Tuval çizimini durdur

            const tempScreenVideo = document.getElementById('temp-screen-video');
            if (tempScreenVideo.srcObject) {
                tempScreenVideo.srcObject.getTracks().forEach(track => track.stop()); // Ekran akışını tamamen kapat
                tempScreenVideo.srcObject = null;
            }

            // Kameraya geri dön (Senin pencerende)
            document.getElementById('my-video').srcObject = localCameraStream;
            
            // Eğer aktif bir arama varsa, giden görüntüyü tekrar kameraya çevir
            if (currentCall) {
                const cameraTrack = localCameraStream.getVideoTracks()[0];
                const videoSender = currentCall.peerConnection.getSenders().find(s => s.track.kind === 'video');
                if (videoSender && cameraTrack) videoSender.replaceTrack(cameraTrack);

                const micTrack = localCameraStream.getAudioTracks()[0];
                const audioSender = currentCall.peerConnection.getSenders().find(s => s.track.kind === 'audio');
                if (audioSender && micTrack) audioSender.replaceTrack(micTrack);
            }
        }

        // 6. Filmi Tam Ekran İzleme
        function openFullscreen() {
            const elem = document.getElementById("remote-video");
            if (elem.requestFullscreen) elem.requestFullscreen();
            else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
            else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
        }
    </script>
</body>
</html>
