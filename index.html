<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Özel Görüntülü Sohbet & Sinema Odası</title>
    <!-- PeerJS Kütüphanesi -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background: #121212; 
            color: #e0e0e0; 
            margin: 0; 
            padding: 15px; 
            padding-bottom: 40px;
        }
        
        h2 { margin-top: 10px; font-size: 1.8rem; color: #ffffff; }

        .controls { 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            gap: 12px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            max-width: 450px;
            margin: 0 auto 20px auto;
        }

        .buttons-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            width: 100%;
            justify-content: center;
        }

        input, button { 
            padding: 12px 15px; 
            font-size: 15px; 
            border-radius: 8px; 
            border: none; 
            transition: all 0.3s ease;
        }

        input[type="text"] { 
            width: 100%; 
            background: #2a2a2a; 
            color: white; 
            border: 1px solid #444; 
        }
        
        input[type="text"]:focus { outline: none; border-color: #007bff; }
        
        button { 
            background: #007bff; 
            color: white; 
            cursor: pointer; 
            font-weight: 600;
            flex-grow: 1;
        }
        
        button:hover { background: #0056b3; transform: translateY(-2px); }
        button.action-btn { background: #ff4757; }
        button.action-btn:hover { background: #ff6b81; }
        
        #my-id { font-weight: bold; color: #2ed573; font-size: 1.3em; word-break: break-all; letter-spacing: 1px;}
        
        /* Video Alanı */
        .video-container { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 20px; 
        }
        
        .video-wrapper {
            width: 100%;
            max-width: 450px;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        video { 
            width: 100%; 
            aspect-ratio: 16/9; 
            background: #000; 
            border-radius: 8px; 
            object-fit: cover; 
        }

        .fs-btn {
            margin-top: 10px;
            background: #2ed573;
            width: 100%;
        }
        .fs-btn:hover { background: #7bed9f; }

        /* Sohbet (Chat) Alanı */
        .chat-container {
            width: 100%;
            max-width: 920px; /* İki videonun toplam genişliği kadar */
            margin: 20px auto 0 auto;
            background: #1e1e1e;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .chat-header {
            background: #2a2a2a;
            padding: 10px;
            font-weight: bold;
            font-size: 1.1rem;
            border-bottom: 1px solid #444;
        }

        .chat-messages {
            height: 200px;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: left;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 15px;
            font-size: 14px;
            line-height: 1.4;
        }

        .message.sent {
            align-self: flex-end;
            background: #007bff;
            color: white;
            border-bottom-right-radius: 2px;
        }

        .message.received {
            align-self: flex-start;
            background: #333;
            color: white;
            border-bottom-left-radius: 2px;
        }

        .chat-input-area {
            display: flex;
            padding: 10px;
            background: #2a2a2a;
            gap: 10px;
        }

        .chat-input-area input {
            flex-grow: 1;
            margin: 0;
        }
        
        .chat-input-area button {
            flex-grow: 0;
            width: auto;
            background: #2ed573;
        }
        .chat-input-area button:hover { background: #26b360; }

        /* Scrollbar tasarımı */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e1e1e; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>
<body>

    <h2>🍿 Özel Sinema Odası</h2>
    <div class="controls">
        <p style="margin-top: 0;">Senin ID'n:<br> <span id="my-id">Bağlanıyor...</span></p>
        <input type="text" id="partner-id" placeholder="Karşı tarafın ID'sini gir">
        <div class="buttons-row">
            <button onclick="makeCall()">Bağlan (Ara)</button>
            <button class="action-btn" onclick="shareScreen()">Ekran & Ses Paylaş</button>
        </div>
    </div>

    <div class="video-container">
        <div class="video-wrapper">
            <h3 style="margin-top: 0;">Sen</h3>
            <video id="my-video" autoplay muted playsinline></video>
        </div>
        <div class="video-wrapper">
            <h3 style="margin-top: 0;">Arkadaşın</h3>
            <video id="remote-video" autoplay playsinline></video>
            <button class="fs-btn" onclick="openFullscreen()">🎬 Tam Ekranda İzle</button>
        </div>
    </div>

    <!-- Sohbet (Chat) Arayüzü -->
    <div class="chat-container">
        <div class="chat-header">💬 Mesajlar</div>
        <div class="chat-messages" id="chat-messages">
            <div style="text-align: center; color: #777; font-size: 0.9em;">Bağlantı kurulduğunda buradan mesajlaşabilirsiniz.</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Mesajını yaz..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Gönder</button>
        </div>
    </div>

    <script>
        const peer = new Peer();
        let localStream;
        let currentCall;
        let dataConnection; // Chat için veri bağlantısı

        // Kendi ID'ni ekrana yazdır
        peer.on('open', (id) => {
            document.getElementById('my-id').innerText = id;
        });

        // 1. Kamerayı ve Mikrofonu Başlat
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then((stream) => {
                localStream = stream;
                document.getElementById('my-video').srcObject = stream;
            })
            .catch(err => console.error("Kamera/Mikrofon izni alınamadı!", err));

        // 2. Karşıdan Gelen Aramayı ve Chat Bağlantısını Cevapla (Aranan Kişi)
        peer.on('call', (call) => {
            currentCall = call;
            call.answer(localStream); 
            
            call.on('stream', (remoteStream) => {
                document.getElementById('remote-video').srcObject = remoteStream;
                playRemoteVideo();
            });
        });

        // Karşıdan gelen Chat bağlantısını dinle
        peer.on('connection', (conn) => {
            dataConnection = conn;
            setupChatListener();
        });

        // 3. Arama Yapma ve Chat Bağlantısı Kurma (Arayan Kişi)
        function makeCall() {
            const partnerId = document.getElementById('partner-id').value;
            if (!partnerId) return alert("Lütfen bir ID girin!");

            // Videoyu bağla
            const call = peer.call(partnerId, localStream);
            currentCall = call;

            call.on('stream', (remoteStream) => {
                document.getElementById('remote-video').srcObject = remoteStream;
                playRemoteVideo();
            });

            // Chat'i bağla
            dataConnection = peer.connect(partnerId);
            setupChatListener();
        }

        // Mobil otomatik oynatma çözümü
        function playRemoteVideo() {
            setTimeout(() => {
                document.getElementById('remote-video').play().catch(err => {
                    console.log("Oynatma hatası:", err);
                });
            }, 500);
        }

        // 4. Sohbet (Chat) Fonksiyonları
        function setupChatListener() {
            dataConnection.on('open', () => {
                document.getElementById('chat-messages').innerHTML = '<div style="text-align: center; color: #2ed573; font-size: 0.9em;">Bağlantı başarılı! Mesajlaşabilirsiniz.</div>';
            });

            // Mesaj geldiğinde ekrana yazdır
            dataConnection.on('data', (data) => {
                appendMessage(data, 'received');
            });
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            
            if (!message) return;
            if (!dataConnection || !dataConnection.open) {
                alert("Önce karşı tarafla bağlanmalısınız!");
                return;
            }

            // Mesajı gönder ve kendi ekranına yaz
            dataConnection.send(message);
            appendMessage(message, 'sent');
            input.value = ''; // Kutuyu temizle
        }

        function appendMessage(text, type) {
            const chatBox = document.getElementById('chat-messages');
            const msgElement = document.createElement('div');
            msgElement.classList.add('message', type);
            msgElement.innerText = text;
            
            chatBox.appendChild(msgElement);
            // Scroll'u her zaman en alta kaydır
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Enter tuşuna basınca mesaj gönderme
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // 5. Ekran ve SES Paylaşımı
        function shareScreen() {
            navigator.mediaDevices.getDisplayMedia({ video: true, audio: true })
                .then((screenStream) => {
                    document.getElementById('my-video').srcObject = screenStream;
                    
                    if (currentCall) {
                        const videoTrack = screenStream.getVideoTracks()[0];
                        const videoSender = currentCall.peerConnection.getSenders().find(s => s.track.kind === 'video');
                        if (videoSender && videoTrack) videoSender.replaceTrack(videoTrack);

                        const audioTrack = screenStream.getAudioTracks()[0];
                        const audioSender = currentCall.peerConnection.getSenders().find(s => s.track.kind === 'audio');
                        
                        if (audioTrack && audioSender) {
                            audioSender.replaceTrack(audioTrack);
                        }
                    }

                    screenStream.getVideoTracks()[0].onended = () => {
                        document.getElementById('my-video').srcObject = localStream;
                        if (currentCall) {
                            const cameraTrack = localStream.getVideoTracks()[0];
                            const videoSender = currentCall.peerConnection.getSenders().find(s => s.track.kind === 'video');
                            if (videoSender && cameraTrack) videoSender.replaceTrack(cameraTrack);

                            const micTrack = localStream.getAudioTracks()[0];
                            const audioSender = currentCall.peerConnection.getSenders().find(s => s.track.kind === 'audio');
                            if (audioSender && micTrack) audioSender.replaceTrack(micTrack);
                        }
                    };
                })
                .catch(err => console.error("Ekran paylaşılamadı!", err));
        }

        // 6. Filmi Tam Ekran İzleme
        function openFullscreen() {
            const elem = document.getElementById("remote-video");
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            }
        }
    </script>
</body>
</html>
