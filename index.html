<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Özel Görüntülü Sohbet</title>
    <!-- PeerJS Kütüphanesi -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        /* Mobil uyumluluk için temel ayar */
        * { box-sizing: border-box; }
        
        body { 
            font-family: sans-serif; 
            text-align: center; 
            background: #1a1a1a; 
            color: white; 
            margin: 0; 
            padding: 15px; 
        }
        
        h2 { margin-top: 10px; font-size: 1.5rem; }

        /* Responsive Video Düzeni */
        .video-container { 
            display: flex; 
            flex-wrap: wrap; /* Ekrana sığmazsa videoları alt alta at */
            justify-content: center; 
            gap: 20px; 
            margin-top: 20px; 
        }
        
        .video-container > div {
            width: 100%;
            max-width: 400px; /* Bilgisayarda çok büyümesini engelle */
        }

        video { 
            width: 100%; /* Bulunduğu kabın tamamını kapla (mobil için kritik) */
            aspect-ratio: 4/3; /* Video oranını koru */
            background: #000; 
            border: 2px solid #444; 
            border-radius: 10px; 
            object-fit: cover; 
        }

        /* Responsive Butonlar ve Kontroller */
        .controls { 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            gap: 10px;
            margin-top: 20px; 
        }

        .buttons-row {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 320px;
        }

        input, button { 
            padding: 14px; 
            font-size: 16px; 
            border-radius: 8px; 
            border: none; 
            width: 100%;
        }

        input { max-width: 320px; text-align: center; }
        
        button { 
            background: #007bff; 
            color: white; 
            cursor: pointer; 
            font-weight: bold;
        }
        
        button:hover { background: #0056b3; }
        
        #my-id { font-weight: bold; color: #00ff88; font-size: 1.2em; word-break: break-all; }
    </style>
</head>
<body>

    <h2>Özel Görüntülü Sohbet</h2>
    <p>Senin ID'n:<br> <span id="my-id">Bağlanıyor...</span></p>
    
    <div class="controls">
        <input type="text" id="partner-id" placeholder="Karşı tarafın ID'sini gir">
        <div class="buttons-row">
            <button onclick="makeCall()">Ara</button>
            <button onclick="shareScreen()">Ekran Paylaş</button>
        </div>
    </div>

    <div class="video-container">
        <div>
            <h3>Sen</h3>
            <video id="my-video" autoplay muted playsinline></video>
        </div>
        <div>
            <h3>O</h3>
            <video id="remote-video" autoplay playsinline></video>
        </div>
    </div>

    <script>
        const peer = new Peer();
        let localStream;
        let currentCall;

        peer.on('open', (id) => {
            document.getElementById('my-id').innerText = id;
        });

        // 1. Adım: Kamerayı ve Mikrofonu Başlat
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then((stream) => {
                localStream = stream;
                document.getElementById('my-video').srcObject = stream;
            })
            .catch(err => console.error("Kamera izni alınamadı!", err));

        // 2. Adım: Karşıdan Gelen Aramayı Cevapla (Aranan Kişi)
        peer.on('call', (call) => {
            currentCall = call;
            call.answer(localStream); 
            
            call.on('stream', (remoteStream) => {
                document.getElementById('remote-video').srcObject = remoteStream;
                
                // Mobil ses onayı için eklenti
                setTimeout(() => {
                    document.getElementById('remote-video').play().catch(err => {
                        console.log("Kullanıcının ekrana dokunması gerekiyor:", err);
                        alert("Sesi duymak için lütfen ekrana bir kez dokunun!");
                    });
                }, 500);
            });
        });

        // 3. Adım: Arama Yapma Fonksiyonu (Arayan Kişi)
        function makeCall() {
            const partnerId = document.getElementById('partner-id').value;
            if (!partnerId) return alert("Lütfen bir ID girin!");

            const call = peer.call(partnerId, localStream);
            currentCall = call;

            call.on('stream', (remoteStream) => {
                document.getElementById('remote-video').srcObject = remoteStream;
                
                // Mobil ses onayı eklentisini buraya da ekledik
                setTimeout(() => {
                    document.getElementById('remote-video').play().catch(err => {
                        console.log("Kullanıcının ekrana dokunması gerekiyor:", err);
                        alert("Sesi duymak için lütfen ekrana bir kez dokunun!");
                    });
                }, 500);
            });
        }

        // 4. Adım: Ekran Paylaşımı
        function shareScreen() {
            navigator.mediaDevices.getDisplayMedia({ video: true })
                .then((screenStream) => {
                    document.getElementById('my-video').srcObject = screenStream;
                    
                    if (currentCall) {
                        const videoTrack = screenStream.getVideoTracks()[0];
                        const sender = currentCall.peerConnection.getSenders().find(s => s.track.kind === 'video');
                        sender.replaceTrack(videoTrack);
                    }

                    screenStream.getVideoTracks()[0].onended = () => {
                        document.getElementById('my-video').srcObject = localStream;
                        if (currentCall) {
                            const cameraTrack = localStream.getVideoTracks()[0];
                            const sender = currentCall.peerConnection.getSenders().find(s => s.track.kind === 'video');
                            sender.replaceTrack(cameraTrack);
                        }
                    };
                })
                .catch(err => console.error("Ekran paylaşılamadı!", err));
        }
    </script>
</body>
</html>
