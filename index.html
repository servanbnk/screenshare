<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Özel Görüntülü Sohbet</title>
    <!-- PeerJS Kütüphanesi -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #1a1a1a; color: white; }
        .video-container { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        video { width: 400px; height: 300px; background: #000; border: 2px solid #444; border-radius: 10px; object-fit: cover; }
        .controls { margin-top: 20px; }
        button, input { padding: 10px; font-size: 16px; margin: 5px; border-radius: 5px; border: none; }
        button { background: #007bff; color: white; cursor: pointer; }
        button:hover { background: #0056b3; }
        #my-id { font-weight: bold; color: #00ff88; font-size: 1.2em; }
    </style>
</head>
<body>

    <h2>Özel Görüntülü Sohbet</h2>
    <p>Senin ID'n: <span id="my-id">Bağlanıyor...</span></p>
    
    <div class="controls">
        <input type="text" id="partner-id" placeholder="Kız arkadaşının ID'sini gir">
        <button onclick="makeCall()">Ara</button>
        <button onclick="shareScreen()">Ekran Paylaş</button>
    </div>

    <div class="video-container">
        <div>
            <h3>Sen</h3>
            <video id="my-video" autoplay muted playsinline></video>
        </div>
        <div>
            <h3>O</h3>
            <video id="remote-video" autoplay playsinline></video>
        </div>
    </div>

    <script>
        // PeerJS sunucusuna bağlan (Ücretsiz ve genel sunucu)
        const peer = new Peer();
        let localStream;
        let currentCall;

        // Bağlantı kurulduğunda sana özel bir ID verir
        peer.on('open', (id) => {
            document.getElementById('my-id').innerText = id;
        });

        // 1. Adım: Kamerayı ve Mikrofonu Başlat
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then((stream) => {
                localStream = stream;
                document.getElementById('my-video').srcObject = stream;
            })
            .catch(err => console.error("Kamera izni alınamadı!", err));

        // 2. Adım: Karşıdan Gelen Aramayı Cevapla
        peer.on('call', (call) => {
            currentCall = call;
            call.answer(localStream); // Kendi görüntünü gönder
            
            call.on('stream', (remoteStream) => {
                // Karşının görüntüsünü ekrana yansıt
                document.getElementById('remote-video').srcObject = remoteStream;
                setTimeout(() => {
    document.getElementById('remote-video').play().catch(err => {
        console.log("Kullanıcının ekrana dokunması gerekiyor:", err);
        alert("Sesi duymak için lütfen ekrana bir kez dokunun!");
    });
}, 500);
            });
        });

        // 3. Adım: Arama Yapma Fonksiyonu
        function makeCall() {
            const partnerId = document.getElementById('partner-id').value;
            if (!partnerId) return alert("Lütfen bir ID girin!");

            const call = peer.call(partnerId, localStream);
            currentCall = call;

            call.on('stream', (remoteStream) => {
                document.getElementById('remote-video').srcObject = remoteStream;
            });
        }

        // 4. Adım: Ekran Paylaşımı
        function shareScreen() {
            navigator.mediaDevices.getDisplayMedia({ video: true })
                .then((screenStream) => {
                    // Kendi pencerendeki görüntüyü ekran ile değiştir
                    document.getElementById('my-video').srcObject = screenStream;
                    
                    // Eğer aktif bir arama varsa, giden video track'ini ekran track'i ile değiştir
                    if (currentCall) {
                        const videoTrack = screenStream.getVideoTracks()[0];
                        const sender = currentCall.peerConnection.getSenders().find(s => s.track.kind === 'video');
                        sender.replaceTrack(videoTrack);
                    }

                    // Ekran paylaşımı durdurulduğunda kameraya geri dön
                    screenStream.getVideoTracks()[0].onended = () => {
                        document.getElementById('my-video').srcObject = localStream;
                        if (currentCall) {
                            const cameraTrack = localStream.getVideoTracks()[0];
                            const sender = currentCall.peerConnection.getSenders().find(s => s.track.kind === 'video');
                            sender.replaceTrack(cameraTrack);
                        }
                    };
                })
                .catch(err => console.error("Ekran paylaşılamadı!", err));
        }
    </script>
</body>
</html>
