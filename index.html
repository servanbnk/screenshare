<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Togetherly - Özel Sinema Odası</title>
    <!-- PeerJS Kütüphanesi -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- İkonlar için FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* --- Temel ve Renk Ayarları --- */
        :root {
            --bg-color: #141414;
            --panel-bg: #1f1f1f;
            --text-color: #e0e0e0;
            --accent-color: #e50914;
            --success-color: #2ed573;
            --primary-btn: #007bff;
            --primary-hover: #0056b3;
            --border-radius: 12px;
            --transition: all 0.3s ease;
        }

        * { box-sizing: border-box; outline: none; }
        
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            margin: 0; 
            padding: 0; 
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh; /* Mobil tarayıcılar için dinamik yükseklik */
            overflow: hidden;
        }

        /* --- Üst Başlık --- */
        header {
            padding: 15px 25px;
            background-color: var(--panel-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            z-index: 10;
        }

        h1 { margin: 0; font-size: 1.5rem; color: #fff; font-weight: 700; letter-spacing: -1px; }
        h1 span { color: var(--accent-color); }

        .status-group { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; }
        #connection-status-dot { width: 10px; height: 10px; background-color: #555; border-radius: 50%; display: inline-block; }
        #connection-status-dot.connected { background-color: var(--success-color); box-shadow: 0 0 10px var(--success-color); }
        #my-id-display { font-weight: bold; color: #fff; background: rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 4px; font-family: monospace;}

        /* --- Ana İçerik Alanı --- */
        main {
            flex-grow: 1;
            display: flex;
            padding: 20px;
            gap: 20px;
            overflow: hidden;
            position: relative;
        }

        /* --- Video Alanı --- */
        .video-grid {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            overflow: hidden;
        }

        .video-wrapper {
            width: 100%;
            height: 100%;
            max-width: 1280px;
            max-height: 720px;
            background-color: #000;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
            border: 2px solid #333;
            aspect-ratio: 16/9;
        }

        video { 
            width: 100%; height: 100%; object-fit: cover; 
        }

        /* Köşedeki kamera overlay'i (Kendi videon) */
        #my-video-overlay {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 20%;
            min-width: 120px;
            max-width: 240px;
            aspect-ratio: 16/9;
            border-radius: 8px;
            border: 2px solid rgba(255,255,255,0.3);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            z-index: 5;
            object-fit: cover;
            background: #000;
        }
        
        /* Tam ekran butonu */
        .fs-btn-overlay {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.5);
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            opacity: 0;
            transition: var(--transition);
            z-index: 6;
        }
        .video-wrapper:hover .fs-btn-overlay { opacity: 1; }

        /* --- Kontrol Paneli (Toolbar) --- */
        .toolbar {
            width: auto;
            background-color: var(--panel-bg);
            padding: 10px 20px;
            border-radius: 50px;
            display: flex;
            gap: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            border: 1px solid #333;
            flex-shrink: 0;
        }

        .toolbar-btn {
            background: none;
            border: none;
            color: #ccc;
            font-size: 1.2rem;
            padding: 12px;
            border-radius: 50%;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .toolbar-btn:hover { background-color: rgba(255,255,255,0.1); color: #fff; }
        .toolbar-btn.active { background-color: var(--accent-color); color: #fff; }
        .toolbar-btn.disabled { color: #555; cursor: not-allowed; }
        
        .toolbar-btn i.fa-microphone-slash, .toolbar-btn i.fa-video-slash { color: var(--accent-color); }

        /* --- Sohbet & Bağlantı Paneli (Sağ Kenar) --- */
        .sidebar {
            width: 320px;
            min-width: 320px;
            background-color: var(--panel-bg);
            border-radius: var(--border-radius);
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: var(--transition);
        }

        /* Bağlantı kurma formu */
        .connection-box {
            padding: 20px;
            border-bottom: 1px solid #333;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        input[type="text"] {
            flex-grow: 1;
            padding: 12px;
            background-color: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            border-radius: 8px;
            font-size: 0.9rem;
        }
        input[type="text"]:focus { border-color: var(--primary-btn); }
        
        .action-btn {
            padding: 12px 18px;
            background-color: var(--primary-btn);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
            white-space: nowrap;
        }
        .action-btn:hover { background-color: var(--primary-hover); }

        /* Chat alanı */
        .chat-panel {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 15px 20px;
            background-color: rgba(255,255,255,0.03);
            border-bottom: 1px solid #333;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
        }

        .chat-messages {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.9rem;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .message.sent { align-self: flex-end; background-color: var(--primary-btn); color: white; border-bottom-right-radius: 2px; }
        .message.received { align-self: flex-start; background-color: #333; color: #fff; border-bottom-left-radius: 2px; }
        .message-meta { font-size: 0.75rem; color: #aaa; margin-bottom: 2px; display: block; }

        .chat-input-area {
            padding: 15px;
            background-color: rgba(0,0,0,0.2);
            border-top: 1px solid #333;
            display: flex;
            gap: 10px;
        }

        /* --- Scrollbar Tasarımı --- */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        /* --- Tuval (Canvas) --- */
        canvas#mixing-canvas { display: none; }

        /* --- Mobil Uyumluluk (Tamamen Yenilendi) --- */
        @media (max-width: 768px) {
            header { padding: 10px 15px; }
            h1 { font-size: 1.2rem; }
            .status-group { font-size: 0.8rem; }
            
            main { 
                flex-direction: column; 
                padding: 10px; 
                gap: 10px;
                overflow-y: auto; /* Mobilde dikey kaydırma açıldı */
            }
            
            .video-grid { 
                flex-shrink: 0; /* Videonun sıkışmasını önler */
                gap: 10px;
            }
            
            .video-wrapper { 
                height: auto; 
                max-height: 35vh; /* Ekranda çok yer kaplamaması için sınır */
            }
            
            #my-video-overlay { 
                width: 25%; 
                bottom: 10px; 
                right: 10px; 
                min-width: 80px;
            }
            
            .fs-btn-overlay { opacity: 1; padding: 6px 10px; } /* Mobilde her zaman görünür */
            
            .toolbar { 
                width: 100%; 
                justify-content: center; 
                border-radius: 12px;
                padding: 8px;
            }
            
            .sidebar { 
                width: 100%; 
                min-width: 100%; 
                flex-grow: 1; 
                min-height: 400px; /* Chat alanı için minimum yükseklik */
                border: none;
            }
            
            .connection-box { 
                display: block; /* GİZLEME İPTAL EDİLDİ */
                padding: 15px 10px; 
            }
            
            .chat-messages { padding: 10px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Togetherly <span>🍿</span></h1>
        <div class="status-group">
            <span id="connection-status-dot"></span>
            <span id="status-text">Bağlanıyor...</span>
            <span id="my-id-display">ID Alınıyor...</span>
        </div>
    </header>

    <main>
        <!-- Video Alanı -->
        <div class="video-grid">
            <div class="video-wrapper">
                <!-- Karşı Taraf (Remote) Video -->
                <video id="remote-video" autoplay playsinline></video>
                <button class="fs-btn-overlay" onclick="toggleFullscreen('remote-video')" title="Tam Ekran">
                    <i class="fas fa-expand"></i>
                </button>
                
                <!-- Kendi Kamera Overlay'in -->
                <video id="my-video-overlay" autoplay muted playsinline></video>
            </div>

            <!-- Kontrol Toolbar'ı -->
            <div class="toolbar">
                <button class="toolbar-btn" id="mic-btn" onclick="toggleMic()" title="Mikrofonu Aç/Kapat">
                    <i class="fas fa-microphone"></i>
                </button>
                <button class="toolbar-btn" id="cam-btn" onclick="toggleCam()" title="Kamerayı Aç/Kapat">
                    <i class="fas fa-video"></i>
                </button>
                <button class="toolbar-btn action-btn" id="share-btn" onclick="toggleScreenShare()" title="Ekran & Ses Paylaş">
                    <i class="fas fa-desktop"></i>
                </button>
                <button class="toolbar-btn" id="remote-vol-btn" onclick="toggleRemoteVolume()" title="Karşının Sesini Kapat">
                    <i class="fas fa-volume-up"></i>
                </button>
            </div>
        </div>

        <!-- Sağ Kenar Çubuğu (Bağlantı ve Chat) -->
        <aside class="sidebar" id="sidebar">
            <!-- Bağlantı Formu -->
            <div class="connection-box">
                <label style="font-weight:600; font-size:0.9rem;">Arkadaşına Bağlan</label>
                <div class="input-group">
                    <input type="text" id="partner-id" placeholder="Onun ID'sini yapıştır...">
                    <button class="action-btn" onclick="makeCall()">Bağlan</button>
                </div>
            </div>

            <!-- Chat Paneli -->
            <div class="chat-panel">
                <div class="chat-header">
                    <span>💬 Sohbet</span>
                </div>
                <div class="chat-messages" id="chat-messages">
                    <div style="text-align: center; color: #777; font-size: 0.85rem; margin-top: 20px;">
                        Henüz mesaj yok.<br>Bağlandıktan sonra yazışabilirsiniz.
                    </div>
                </div>
                <div class="chat-input-area">
                    <input type="text" id="chat-input" placeholder="Mesajını yaz..." onkeypress="handleKeyPress(event)">
                    <button class="action-btn" onclick="sendMessage()">Gönder</button>
                </div>
            </div>
        </aside>
    </main>

    <!-- Görüntü Birleştirme için Tuval (Canvas - Gizli) -->
    <canvas id="mixing-canvas" width="1280" height="720"></canvas>
    <!-- Gizli video kaynakları -->
    <video id="temp-camera-video" autoplay muted playsinline style="display:none;"></video>
    <video id="temp-screen-video" autoplay muted playsinline style="display:none;"></video>

    <script>
        // --- Değişkenler ve Ayarlar ---
        const peer = new Peer();
        let localCameraStream;
        let currentCall;
        let dataConnection;
        
        let isMicOn = true;
        let isCamOn = true;
        let isRemoteAudioOn = true;
        let isSharingScreen = false;
        
        let animationFrameId;

        // --- DOM Elemanları ---
        const statusDot = document.getElementById('connection-status-dot');
        const statusText = document.getElementById('status-text');
        const myIdDisplay = document.getElementById('my-id-display');
        const remoteVideo = document.getElementById('remote-video');
        const myVideoOverlay = document.getElementById('my-video-overlay');
        const micBtn = document.getElementById('mic-btn');
        const camBtn = document.getElementById('cam-btn');
        const shareBtn = document.getElementById('share-btn');
        const remoteVolBtn = document.getElementById('remote-vol-btn');
        const chatMessages = document.getElementById('chat-messages');

        // --- 1. Başlangıç: ID Al ve Kamerayı Başlat ---
        peer.on('open', (id) => {
            myIdDisplay.innerText = id;
            statusDot.classList.add('connected');
            statusText.innerText = "Hazır (Bağlantı Bekleniyor)";
            appendSystemMessage("Kendi ID'n alındı. Arkadaşına gönder.");
        });

        peer.on('error', (err) => {
            console.error("PeerJS Hatası:", err);
            statusText.innerText = "Hata!";
            statusDot.style.backgroundColor = 'red';
            appendSystemMessage("Bir bağlantı hatası oluştu.");
        });

        // Kamerayı ve Mikrofonu Başlat
        navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 }, audio: true })
            .then((stream) => {
                localCameraStream = stream;
                myVideoOverlay.srcObject = stream;
                document.getElementById('temp-camera-video').srcObject = stream;
            })
            .catch(err => {
                console.error("Kamera/Mikrofon izni alınamadı!", err);
                appendSystemMessage("Hata: Kamera veya mikrofon izni verilmedi.");
            });

        // --- 2. Bağlantıyı Yakala (Aranan Taraf) ---
        peer.on('call', (call) => {
            currentCall = call;
            call.answer(localCameraStream);
            setupCallListeners(call);
            updateStatus("Eşleşildi!");
        });

        peer.on('connection', (conn) => {
            dataConnection = conn;
            setupChatListener(conn);
        });

        // --- 3. Bağlantı Kur (Arayan Taraf) ---
        function makeCall() {
            const partnerId = document.getElementById('partner-id').value.trim();
            if (!partnerId) return alert("Lütfen arkadaşınızın ID'sini girin!");

            updateStatus("Bağlanılıyor...");

            const call = peer.call(partnerId, localCameraStream);
            currentCall = call;
            setupCallListeners(call);

            const conn = peer.connect(partnerId);
            dataConnection = conn;
            setupChatListener(conn);
        }

        function setupCallListeners(call) {
            call.on('stream', (remoteStream) => {
                remoteVideo.srcObject = remoteStream;
                playRemoteVideo();
            });
            call.on('close', () => {
                appendSystemMessage("Arama sona erdi.");
                updateStatus("Bağlantı Kesildi.");
                remoteVideo.srcObject = null;
            });
        }

        function playRemoteVideo() {
            setTimeout(() => {
                remoteVideo.play().catch(err => console.log("Otomatik oynatma engellendi:", err));
            }, 500);
        }

        // --- 4. Gelişmiş Toolbar Kontrolleri ---
        function toggleMic() {
            if (!localCameraStream) {
                alert("Mikrofon henüz hazır değil.");
                return; 
            }
            
            isMicOn = !isMicOn;
            localCameraStream.getAudioTracks().forEach(track => {
                track.enabled = isMicOn;
            });
            
            updateBtnState(micBtn, isMicOn, 'fa-microphone', 'fa-microphone-slash');
            appendSystemMessage(isMicOn ? "🎤 Mikrofon açıldı." : "🔇 Mikrofon kapatıldı.");
        }

        function toggleCam() {
            if (!localCameraStream) {
                alert("Kamera henüz hazır değil.");
                return;
            }

            isCamOn = !isCamOn;
            localCameraStream.getVideoTracks().forEach(track => {
                track.enabled = isCamOn;
            });
            
            updateBtnState(camBtn, isCamOn, 'fa-video', 'fa-video-slash');
            myVideoOverlay.style.display = isCamOn ? 'block' : 'none';
            appendSystemMessage(isCamOn ? "📷 Kamera açıldı." : "🚫 Kamera kapatıldı.");
        }

        function toggleRemoteVolume() {
            if (!remoteVideo.srcObject) return;
            
            isRemoteAudioOn = !isRemoteAudioOn;
            remoteVideo.muted = !isRemoteAudioOn;
            updateBtnState(remoteVolBtn, isRemoteAudioOn, 'fa-volume-up', 'fa-volume-mute');
            appendSystemMessage(isRemoteAudioOn ? "🔊 Karşının sesi açıldı." : "🔇 Karşının sesi susturuldu.");
        }

        function updateBtnState(btn, isOn, onIcon, offIcon) {
            const icon = btn.querySelector('i');
            if (isOn) {
                btn.classList.remove('active');
                icon.className = `fas ${onIcon}`;
            } else {
                btn.classList.add('active');
                icon.className = `fas ${offIcon}`;
            }
        }

        // --- 5. Gelişmiş Ekran ve SES Paylaşımı ---
        function toggleScreenShare() {
            if (isSharingScreen) {
                stopScreenSharing();
            } else {
                startScreenSharing();
            }
        }

        function startScreenSharing() {
            if (!currentCall) return alert("Önce bağlanmalısınız!");

            navigator.mediaDevices.getDisplayMedia({ video: { width: 1280, height: 720 }, audio: true })
                .then((screenStream) => {
                    isSharingScreen = true;
                    shareBtn.classList.add('active');
                    shareBtn.innerHTML = '<i class="fas fa-stop-circle"></i> Paylaşımı Durdur';
                    
                    const tempScreenVideo = document.getElementById('temp-screen-video');
                    tempScreenVideo.srcObject = screenStream;
                    
                    const canvas = document.getElementById('mixing-canvas');
                    const ctx = canvas.getContext('2d');
                    const tempCameraVideo = document.getElementById('temp-camera-video');

                    function drawOverlay() {
                        if (!isSharingScreen) return;

                        ctx.drawImage(tempScreenVideo, 0, 0, canvas.width, canvas.height);
                        
                        if (isCamOn) {
                            const camWidth = canvas.width * 0.18;
                            const camHeight = canvas.height * 0.18;
                            const x = canvas.width - camWidth - 25;
                            const y = canvas.height - camHeight - 25;
                            
                            ctx.shadowColor = "rgba(0,0,0,0.5)";
                            ctx.shadowBlur = 15;
                            ctx.lineWidth = 5;
                            ctx.strokeStyle = "#2a2a2a";
                            
                            ctx.strokeRect(x, y, camWidth, camHeight);
                            ctx.drawImage(tempCameraVideo, x, y, camWidth, camHeight);
                            
                            ctx.shadowBlur = 0;
                        }

                        animationFrameId = requestAnimationFrame(drawOverlay);
                    }

                    drawOverlay();

                    const mixedStream = canvas.captureStream(30);

                    if (screenStream.getAudioTracks().length > 0) {
                        mixedStream.addTrack(screenStream.getAudioTracks()[0]);
                    }

                    replaceStreamInCall(mixedStream);
                    screenStream.getVideoTracks()[0].onended = stopScreenSharing;
                })
                .catch(err => {
                    console.error("Ekran paylaşılamadı!", err);
                    stopScreenSharing();
                });
        }

        function stopScreenSharing() {
            if (!isSharingScreen) return;
            isSharingScreen = false;
            
            shareBtn.classList.remove('active');
            shareBtn.innerHTML = '<i class="fas fa-desktop"></i> Ekran & Ses Paylaş';
            cancelAnimationFrame(animationFrameId);

            const tempScreenVideo = document.getElementById('temp-screen-video');
            if (tempScreenVideo.srcObject) {
                tempScreenVideo.srcObject.getTracks().forEach(track => track.stop());
                tempScreenVideo.srcObject = null;
            }

            if (currentCall) {
                replaceStreamInCall(localCameraStream);
            }
        }

        function replaceStreamInCall(newStream) {
            const videoTrack = newStream.getVideoTracks()[0];
            const videoSender = currentCall.peerConnection.getSenders().find(s => s.track.kind === 'video');
            if (videoSender && videoTrack) videoSender.replaceTrack(videoTrack);

            const audioTrack = newStream.getAudioTracks()[0];
            const audioSender = currentCall.peerConnection.getSenders().find(s => s.track.kind === 'audio');
            if (audioSender && audioTrack) audioSender.replaceTrack(audioTrack);
        }

        // --- 6. Sohbet (Chat) Fonksiyonları ---
        function setupChatListener(conn) {
            conn.on('open', () => {
                appendSystemMessage("Sohbet bağlantısı kuruldu.");
                updateStatus("Eşleşildi (Chat Aktif)");
            });
            conn.on('data', (data) => {
                appendMessage(data, 'received');
            });
            conn.on('close', () => {
                appendSystemMessage("Sohbet bağlantısı koptu.");
            });
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            if (!message) return;
            if (!dataConnection || !dataConnection.open) return appendSystemMessage("Önce bağlanmalısınız.");

            dataConnection.send(message);
            appendMessage(message, 'sent');
            input.value = '';
        }

        function appendMessage(text, type) {
            const noMsg = chatMessages.querySelector('div[style*="text-align: center"]');
            if (noMsg) noMsg.remove();

            const msgElement = document.createElement('div');
            msgElement.classList.add('message', type);
            
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const metaElement = document.createElement('span');
            metaElement.classList.add('message-meta');
            metaElement.innerText = type === 'sent' ? `Sen, ${time}` : `O, ${time}`;
            
            msgElement.appendChild(metaElement);
            
            const textNode = document.createTextNode(text);
            msgElement.appendChild(textNode);
            
            chatMessages.appendChild(msgElement);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function appendSystemMessage(text) {
            const msgElement = document.createElement('div');
            msgElement.style.cssText = "text-align: center; color: #777; font-size: 0.8rem; margin: 5px 0;";
            msgElement.innerText = `— ${text} —`;
            chatMessages.appendChild(msgElement);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function handleKeyPress(event) { if (event.key === 'Enter') sendMessage(); }

        // --- 7. Yardımcı Fonksiyonlar ---
        function updateStatus(text) { statusText.innerText = text; }

        function toggleFullscreen(videoId) {
            const elem = document.getElementById(videoId);
            if (!elem.srcObject) return;

            if (elem.requestFullscreen) elem.requestFullscreen();
            else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
            else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
        }
    </script>
</body>
</html>
